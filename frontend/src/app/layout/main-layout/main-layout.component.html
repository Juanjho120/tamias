<div class="app-shell d-flex">
  <aside class="sidebar d-none d-lg-flex flex-column p-3">
    <div class="d-flex align-items-center gap-2 px-2 py-3 mb-3 text-white">
      <span class="d-inline-flex align-items-center justify-content-center rounded-3 bg-primary p-2">
        <i class="bi bi-house-heart-fill"></i>
      </span>
      <div>
        <div class="fw-bold fs-5">TAMIAS</div>
        <div class="small text-white-50">Operations Platform</div>
      </div>
    </div>

    <nav class="nav nav-pills flex-column gap-1">
      @for (item of menuItems; track item.route) {
        <a
          class="nav-link d-flex align-items-center gap-2"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
          <i class="bi" [ngClass]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="mt-auto border-top border-secondary pt-3 text-white-50 small">
      <div class="text-white fw-semibold">{{ displayName() }}</div>
      <div>{{ user()?.role }}</div>
    </div>
  </aside>

  <div class="main-content flex-grow-1">
    <header class="navbar navbar-expand-lg bg-white border-bottom px-3 px-lg-4">
      <div class="container-fluid px-0">
        <button
          class="btn btn-outline-secondary d-lg-none"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#mobileSidebar"
          aria-controls="mobileSidebar">
          <i class="bi bi-list"></i>
        </button>

        <span class="navbar-brand mb-0 h1 d-lg-none">TAMIAS</span>

        <div class="ms-auto d-flex align-items-center gap-3">
          <div class="d-none d-md-block text-end">
            <div class="fw-semibold">{{ displayName() }}</div>
            <div class="small text-muted">{{ user()?.organization?.name }}</div>
          </div>
          <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="p-3 p-lg-4">
      <router-outlet />
    </main>
  </div>
</div>

<div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="mobileSidebar">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">TAMIAS</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <nav class="nav nav-pills flex-column gap-1">
      @for (item of menuItems; track item.route) {
        <a
          class="nav-link d-flex align-items-center gap-2 text-white"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
          <i class="bi" [ngClass]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
</div>

<app-toast-container />
