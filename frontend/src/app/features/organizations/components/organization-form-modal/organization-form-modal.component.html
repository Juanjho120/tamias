@if (open) {
  <div class="modal-backdrop fade show"></div>
  <div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" [formGroup]="form" (ngSubmit)="submit()">
        <div class="modal-header">
          <div>
            <h5 class="modal-title">
              {{ (mode === 'create' ? 'organizations.form.createTitle' : 'organizations.form.editTitle') | translate }}
            </h5>
            <p class="text-body-secondary small mb-0">{{ 'organizations.form.subtitle' | translate }}</p>
          </div>
          <button type="button" class="btn-close" [attr.aria-label]="'common.close' | translate" (click)="cancel.emit()"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="organizationName">{{ 'organizations.form.name' | translate }}</label>
            <input
              id="organizationName"
              type="text"
              class="form-control"
              formControlName="name"
              [class.is-invalid]="isInvalid('name')"
              maxlength="150"
            />
            @if (isInvalid('name')) {
              <div class="invalid-feedback">{{ 'organizations.validation.name' | translate }}</div>
            }
          </div>

          <div class="mb-0">
            <label class="form-label" for="organizationDescription">{{ 'organizations.form.description' | translate }}</label>
            <textarea
              id="organizationDescription"
              class="form-control"
              formControlName="description"
              rows="3"
            ></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="cancel.emit()" [disabled]="loading">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            @if (loading) {
              <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            }
            {{ 'organizations.form.save' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
