@if (open) {
  <div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <div>
            <h5 class="modal-title mb-1">
              {{ mode === 'create' ? 'Crear organización' : 'Editar organización' }}
            </h5>
            <p class="text-body-secondary small mb-0">
              Completa la información principal de la organización.
            </p>
          </div>
          <button
            type="button"
            class="btn-close"
            aria-label="Cerrar"
            [disabled]="loading"
            (click)="cancel.emit()">
          </button>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="organizationName">Nombre</label>
                <input
                  id="organizationName"
                  type="text"
                  class="form-control"
                  formControlName="name"
                  [ngClass]="{ 'is-invalid': isInvalid('name') }"
                  maxlength="150">
                @if (isInvalid('name')) {
                  <div class="invalid-feedback">
                    El nombre es obligatorio y no debe exceder 150 caracteres.
                  </div>
                }
              </div>

              <div class="col-12">
                <label class="form-label" for="organizationDescription">Descripción</label>
                <textarea
                  id="organizationDescription"
                  class="form-control"
                  rows="3"
                  formControlName="description">
                </textarea>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              [disabled]="loading"
              (click)="cancel.emit()">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="loading">
              @if (loading) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              }
              Guardar organización
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show"></div>
}
