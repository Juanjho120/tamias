<section class="auth-page d-flex align-items-center justify-content-center px-3">
  <div class="card page-card w-100" style="max-width: 460px;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-4 bg-primary text-white p-3 mb-3">
          <i class="bi bi-house-heart-fill fs-2"></i>
        </div>
        <h1 class="h3 mb-1">{{ 'login.title' | translate }}</h1>
        <p class="text-muted mb-0">{{ 'login.subtitle' | translate }}</p>
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">{{ 'login.email' | translate }}</label>
          <input
            id="email"
            type="email"
            class="form-control"
            [ngClass]="{ 'is-invalid': isInvalid('email') }"
            formControlName="email"
            autocomplete="email"
            placeholder="admin@tamias.local">
          @if (isInvalid('email')) {
            <div class="invalid-feedback">
              {{ 'login.validation.email' | translate }}
            </div>
          }
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">{{ 'login.password' | translate }}</label>
          <input
            id="password"
            type="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': isInvalid('password') }"
            formControlName="password"
            autocomplete="current-password"
            [placeholder]="'login.passwordPlaceholder' | translate">
          @if (isInvalid('password')) {
            <div class="invalid-feedback">
              {{ 'login.validation.password' | translate }}
            </div>
          }
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            {{ 'login.signingIn' | translate }}
          } @else {
            {{ 'login.signIn' | translate }}
          }
        </button>
      </form>
    </div>
  </div>
</section>
