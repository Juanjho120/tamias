<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="mb-3">
    <label for="property-name" class="form-label">Name</label>
    <input
      id="property-name"
      type="text"
      class="form-control"
      [ngClass]="{ 'is-invalid': isInvalid('name') }"
      formControlName="name"
      maxlength="150"
      placeholder="Casa Vista Hermosa">
    @if (isInvalid('name')) {
      <div class="invalid-feedback">
        Name is required and must not exceed 150 characters.
      </div>
    }
  </div>

  <div class="mb-3">
    <label for="property-address" class="form-label">Address</label>
    <textarea
      id="property-address"
      class="form-control"
      formControlName="address"
      rows="2"
      placeholder="Sololá, Guatemala"></textarea>
  </div>

  <div class="mb-3">
    <label for="property-description" class="form-label">Description</label>
    <textarea
      id="property-description"
      class="form-control"
      formControlName="description"
      rows="4"
      placeholder="Short description of the property"></textarea>
  </div>

  <div class="mb-4">
    <label for="property-status" class="form-label">Status</label>
    <select
      id="property-status"
      class="form-select"
      [ngClass]="{ 'is-invalid': isInvalid('status') }"
      formControlName="status">
      @for (status of statuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>
    @if (isInvalid('status')) {
      <div class="invalid-feedback">
        Status is required.
      </div>
    }
  </div>

  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel.emit()" [disabled]="loading">
      Cancel
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="loading">
      @if (loading) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        Saving...
      } @else {
        Save property
      }
    </button>
  </div>
</form>
