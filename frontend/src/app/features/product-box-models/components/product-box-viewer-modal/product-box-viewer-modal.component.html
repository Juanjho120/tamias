@if (open) {
  <div class="modal fade show d-block" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title mb-1">{{ 'productBoxModels.viewer.title' | translate }}</h5>
            @if (model) {
              <div class="text-muted small">
                {{ model.name }} · {{ dimensionsLabel() }}
              </div>
            }
          </div>
          <button type="button" class="btn-close" [attr.aria-label]="'common.close' | translate" (click)="close()"></button>
        </div>

        <div class="modal-body">
          @if (model) {
            <app-product-box-viewer [model]="model" />
          } @else {
            <div class="text-center text-muted py-5">
              {{ 'productBoxModels.viewer.noModel' | translate }}
            </div>
          }
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="close()">
            {{ 'common.close' | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show"></div>
}
