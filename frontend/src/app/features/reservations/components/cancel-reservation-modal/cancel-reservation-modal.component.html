@if (open) {
  <div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <div>
            <h5 class="modal-title">{{ 'reservations.cancel.title' | translate }}</h5>
            <div class="small text-muted">{{ reservationTitle }}</div>
          </div>
          <button type="button" class="btn-close" aria-label="Close" [disabled]="loading" (click)="cancel.emit()"></button>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="modal-body">
            <label for="reservation-cancel-reason" class="form-label">
              {{ 'reservations.cancel.reason' | translate }}
            </label>
            <textarea id="reservation-cancel-reason" class="form-control" rows="3" formControlName="reason"></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" [disabled]="loading" (click)="cancel.emit()">
              {{ 'common.cancel' | translate }}
            </button>
            <button type="submit" class="btn btn-danger" [disabled]="loading">
              @if (loading) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                {{ 'common.saving' | translate }}
              } @else {
                {{ 'reservations.cancel.confirm' | translate }}
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show"></div>
}
