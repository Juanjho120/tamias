services:
  postgres:
    image: postgres:16
    container_name: tamias-prod-like-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tamias
      POSTGRES_USER: tamias
      POSTGRES_PASSWORD: tamias
    ports:
      - "5434:5432"
    volumes:
      - tamias_prod_like_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamias -d tamias"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: tamias-prod-like-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - tamias_prod_like_chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tamias-prod-like-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/tamias
      DATABASE_USERNAME: tamias
      DATABASE_PASSWORD: tamias
      JWT_SECRET: change-me-change-me-change-me-change-me-change-me-change-me-change-me-change-me
      JWT_EXPIRATION_MINUTES: 60
      CORS_ALLOWED_ORIGINS: http://localhost:8088
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-placeholder}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-placeholder}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-tamias-testing-files}
      S3_PRESIGNED_URL_EXPIRATION_SECONDS: 300
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-placeholder}
      OPENAI_CHAT_MODEL: gpt-4o-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_TEMPERATURE: 0.2
      CHROMA_HOST: http://chroma
      CHROMA_PORT: 8000
      CHROMA_BASE_URL: http://chroma:8000
      CHROMA_COLLECTION_NAME: tamias_prod_like_documents
      AI_DEFAULT_TOP_K: 10
      AI_DEFAULT_SIMILARITY_THRESHOLD: 0.30
      MAX_FILE_SIZE: 8MB
      MAX_REQUEST_SIZE: 8MB
      PRODUCT_BOX_OPENCV_ENABLED: ${PRODUCT_BOX_OPENCV_ENABLED:-true}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_API_BASE_URL: /api/v1
    container_name: tamias-prod-like-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8080
    ports:
      - "8088:80"

volumes:
  tamias_prod_like_postgres_data:
  tamias_prod_like_chroma_data:
