spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.2}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST}
          port: ${CHROMA_PORT:8000}
        collection-name: ${CHROMA_COLLECTION_NAME:tamias_documents}
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_REQUEST_SIZE:15MB}

logging:
  level:
    root: info
    com.tamias: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.springframework.security: warn
    org.springframework.web: warn

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

tamias:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    provider: s3
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}
      presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}
  product-box:
    opencv:
      enabled: ${PRODUCT_BOX_OPENCV_ENABLED:true}
  ai:
    default-top-k: ${AI_DEFAULT_TOP_K:10}
    default-similarity-threshold: ${AI_DEFAULT_SIMILARITY_THRESHOLD:0.30}
    vector-store:
      chroma-base-url: ${CHROMA_BASE_URL}
      collection-name: ${CHROMA_COLLECTION_NAME:tamias_documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
