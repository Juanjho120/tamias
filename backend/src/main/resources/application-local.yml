spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/tamias
    username: tamias
    password: tamias
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: tamias_documents
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

security:
  jwt:
    secret: local-development-secret-change-me-before-production
    expiration-minutes: 60

tamias:
  cors:
    allowed-origins: http://localhost:4200
  storage:
    provider: s3
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}
      presigned-url-expiration-seconds: 300
  product-box:
    opencv:
      enabled: ${PRODUCT_BOX_OPENCV_ENABLED:true}
  ai:
    default-top-k: 10
    default-similarity-threshold: 0.30
    vector-store:
      chroma-base-url: http://localhost:8000
      collection-name: tamias_documents
