name: TAMIAS CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tamias
          POSTGRES_USER: tamias
          POSTGRES_PASSWORD: tamias
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamias -d tamias"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_PROFILES_ACTIVE: ci
      OPENAI_API_KEY: ci-placeholder
      AWS_S3_BUCKET: tamias-ci-placeholder
      AWS_REGION: us-east-2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build backend
        run: ./mvnw -B clean package -DskipTests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
