name: TAMIAS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tamias
          POSTGRES_USER: tamias
          POSTGRES_PASSWORD: tamias
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamias -d tamias"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_PROFILES_ACTIVE: ci
      OPENAI_API_KEY: ci-placeholder
      AWS_S3_BUCKET: tamias-ci-placeholder
      AWS_REGION: us-east-2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build backend
        run: ./mvnw -B clean package -DskipTests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker image build and publish
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t tamias-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build --build-arg FRONTEND_API_BASE_URL=/api/v1 -t tamias-frontend:ci ./frontend

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker tag tamias-backend:ci "${{ secrets.DOCKERHUB_USERNAME }}/tamias-backend:latest"
          docker tag tamias-backend:ci "${{ secrets.DOCKERHUB_USERNAME }}/tamias-backend:sha-${SHORT_SHA}"

          docker tag tamias-frontend:ci "${{ secrets.DOCKERHUB_USERNAME }}/tamias-frontend:latest"
          docker tag tamias-frontend:ci "${{ secrets.DOCKERHUB_USERNAME }}/tamias-frontend:sha-${SHORT_SHA}"

      - name: Push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker push "${{ secrets.DOCKERHUB_USERNAME }}/tamias-backend:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/tamias-backend:sha-${SHORT_SHA}"

      - name: Push frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker push "${{ secrets.DOCKERHUB_USERNAME }}/tamias-frontend:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/tamias-frontend:sha-${SHORT_SHA}"
